name: Deploy Resume Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/resume-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS Lightsail
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd ~/OpportunityX-Resume

            git pull origin main

            cd backend

            sudo docker build -t resume-backend:latest .

            sudo docker stop resume-backend || true
            sudo docker rm resume-backend || true

            sudo docker run -d \
              --name resume-backend \
              --env-file .env \
              -p 8000:8000 \
              --restart unless-stopped \
              resume-backend:latest

            sleep 10

            curl -f http://localhost:8000/health

            echo "Resume backend deployed successfully."
